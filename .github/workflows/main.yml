name: Extract DDI (Xcode 27.2 beta)

on:
  workflow_dispatch:

jobs:
  extract-ddi:
    runs-on: xcode-27
    steps:
      - name: Check disk space
        run: df -h /

      - name: Download Xcode 27.2 beta
        env:
          XCODE_XIP_URL: ${{ secrets.XCODE_XIP_URL }}
        run: |
          curl -L -o Xcode_27.2_beta.xip "$XCODE_XIP_URL"

      - name: Expand Xcode .xip
        run: |
          xip --expand Xcode_27.2_beta.xip
          ls -d Xcode*.app

      - name: Move Xcode into /Applications and select it
        run: |
          sudo mv Xcode*.app /Applications/Xcode_27.2_beta.app
          sudo xcode-select -s /Applications/Xcode_27.2_beta.app

      - name: Run Xcode first launch (extracts bundled DDIs)
        run: |
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

      - name: Sanity check
        run: xcodebuild -version

      - name: Clone DeveloperDiskImage repo
        run: git clone https://github.com/doronz88/DeveloperDiskImage.git

      - name: Dry run (sanity check before writing)
        run: |
          cd DeveloperDiskImage
          sudo python3 update_ddi.py --dry-run

      - name: Extract DDIs from the local Xcode install
        run: |
          cd DeveloperDiskImage
          sudo python3 update_ddi.py

      - uses: actions/upload-artifact@v4
        with:
          name: ddi-27.2-beta
          path: |
            DeveloperDiskImage/PersonalizedImages/Xcode_iOS_DDI_Personalized
            DeveloperDiskImage/PersonalizedImages/Xcode_iOS_DDI_Cryptex
          retention-days: 14
