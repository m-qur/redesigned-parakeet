name: Extract DDI (xcode-27 runner)

on:
  workflow_dispatch:

jobs:
  extract-ddi:
    runs-on: xcode-27
    steps:
      - name: Check pre-installed Xcode version
        run: xcodebuild -version

      - name: List all installed Xcode versions on this runner
        run: ls -d /Applications/Xcode*.app

      - name: Run Xcode first launch (extracts bundled DDIs)
        run: |
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

      - name: Download additional platform/device support
        run: xcodebuild -downloadAllPlatforms

      - name: Update device DDIs
        run: xcrun devicectl manage ddis update

      - name: Clone DeveloperDiskImage repo
        run: git clone https://github.com/doronz88/DeveloperDiskImage.git

      - name: Dry run (sanity check before writing)
        run: |
          cd DeveloperDiskImage
          sudo python3 update_ddi.py --dry-run

      - name: Extract DDIs from the local Xcode install
        run: |
          cd DeveloperDiskImage
          sudo python3 update_ddi.py

      - uses: actions/upload-artifact@v4
        with:
          name: ddi-xcode27-runner
          path: |
            DeveloperDiskImage/PersonalizedImages/Xcode_iOS_DDI_Personalized
            DeveloperDiskImage/PersonalizedImages/Xcode_iOS_DDI_Cryptex
          retention-days: 14
